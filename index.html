<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pengumuman Pulang Sekolah - SMPN 3 Besuki</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: #ffffff; width: 100%; max-width: 480px; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #059669 0%, #10b981 100%); padding: 25px 20px; text-align: center; color: white; }
        .logo-container { width: 85px; height: 85px; background: #ffffff; border-radius: 50%; margin: 0 auto 12px; padding: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; }
        .logo-container img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 50%; }
        .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
        .badge-school { display: inline-block; background: rgba(255, 255, 255, 0.2); padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: 1px; }
        .form-body { padding: 25px 20px; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 13px; font-weight: 700; color: #1e293b; margin-bottom: 8px; text-transform: uppercase; }
        .input-control { width: 100%; padding: 12px 16px; font-size: 14px; border: 2px solid #e2e8f0; border-radius: 12px; background-color: #f8fafc; outline: none; }
        .input-control:focus { border-color: #10b981; background-color: #ffffff; }
        .time-picker-wrapper { display: flex; gap: 10px; align-items: center; }
        .time-picker-wrapper select { flex: 1; text-align: center; }
        .card-preview { background: #f0fdf4; border: 1px dashed #86efac; border-radius: 12px; padding: 15px; margin-top: 10px; margin-bottom: 20px; }
        .preview-text { font-size: 13px; color: #1e293b; white-space: pre-line; line-height: 1.5; background: #ffffff; padding: 12px; border-radius: 8px; border: 1px solid #dcfce7; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #25d366 0%, #128c7e 100%); color: white; border: none; padding: 15px; font-size: 16px; font-weight: 700; border-radius: 12px; cursor: pointer; box-shadow: 0 10px 15px -3px rgba(37, 211, 102, 0.3); }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo-container">
            <img src="https://i.ibb.co.com/xKdsvGjP/Whats-App-Image-2026-07-23-at-19-47-58.jpg" alt="Logo SMPN 3 Besuki">
        </div>
        <h1>SMPN 3 BESUKI</h1>
        <div class="badge-school">SISTEM PENGUMUMAN WALI KELAS</div>
    </div>

    <div class="form-body">
        <div class="form-group">
            <label class="form-label">Nama Wali Kelas</label>
            <input type="text" id="walikelas" class="input-control" placeholder="Masukkan nama wali kelas" value="" oninput="updatePreview()">
        </div>

        <div class="form-group">
            <label class="form-label">Kelas</label>
            <input type="text" id="kelas" class="input-control" placeholder="Masukkan kelas (contoh: 7A)" value="" oninput="updatePreview()">
        </div>

        <div class="form-group">
            <label class="form-label">Kondisi Pulang</label>
            <select id="tipe" class="input-control" onchange="toggleKegiatan(); updatePreview();">
                <option value="normal">Jam Pulang Normal</option>
                <option value="awal">Pulang Lebih Awal</option>
            </select>
        </div>

        <div class="form-group hidden" id="formKegiatan">
            <label class="form-label">Nama Kegiatan</label>
            <input type="text" id="kegiatan" class="input-control" placeholder="Masukkan nama kegiatan" value="" oninput="updatePreview()">
        </div>

        <div class="form-group">
            <label class="form-label">Jam Pulang</label>
            <div class="time-picker-wrapper">
                <!-- Pilihan Jam (07 - 13) -->
                <select id="jamJam" class="input-control" onchange="updatePreview()">
                    <option value="07">07</option>
                    <option value="08">08</option>
                    <option value="09">09</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12" selected>12</option>
                    <option value="13">13</option>
                </select>
                <span style="font-weight: bold;">.</span>
                <!-- Pilihan Menit (00 - 45) -->
                <select id="jamMenit" class="input-control" onchange="updatePreview()">
                    <option value="00" selected>00</option>
                    <option value="05">05</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                    <option value="25">25</option>
                    <option value="30">30</option>
                    <option value="35">35</option>
                    <option value="40">40</option>
                    <option value="45">45</option>
                </select>
                <span style="font-weight: bold; color: #64748b;">WIB</span>
            </div>
        </div>

        <div class="card-preview">
            <h4 style="margin-bottom:8px; color:#166534;">Pratinjau Pesan WA</h4>
            <div class="preview-text" id="previewText"></div>
        </div>

        <button class="btn-submit" onclick="kirimWA()">Kirim Pengumuman WA</button>
    </div>
</div>

<script>
    function toggleKegiatan() {
        var tipe = document.getElementById("tipe").value;
        document.getElementById("formKegiatan").classList.toggle("hidden", tipe !== "awal");
    }

    function generatePesan() {
        var walikelas = document.getElementById("walikelas").value.trim() || "[Nama Wali Kelas]";
        var kelas = document.getElementById("kelas").value.trim() || "[Kelas]";
        var tipe = document.getElementById("tipe").value;
        var jam = document.getElementById("jamJam").value + "." + document.getElementById("jamMenit").value;
        var kegiatan = document.getElementById("kegiatan").value.trim() || "[Nama Kegiatan]";

        if (tipe === "normal") {
            return "*PENGUMUMAN JAM PULANG SEKOLAH*\n" +
                   "*SMP NEGERI 3 BESUKI*\n\n" +
                   "Yth. Bapak/Ibu Orang Tua/Wali Murid Kelas " + kelas + "\n\n" +
                   "Diberitahukan bahwa kegiatan belajar mengajar hari ini telah selesai pada pukul *" + jam + " WIB*.\n\n" +
                   "Mohon Bapak/Ibu dapat bersiap untuk penjemputan para siswa. Terima kasih atas kerja samanya.\n\n" +
                   "Hormat kami,\n" +
                   "Wali Kelas " + kelas + "\n" +
                   "*" + walikelas + "*";
        } else {
            return "*PENGUMUMAN PULANG LEBIH AWAL*\n" +
                   "*SMP NEGERI 3 BESUKI*\n\n" +
                   "Yth. Bapak/Ibu Orang Tua/Wali Murid Kelas " + kelas + "\n\n" +
                   "Diberitahukan bahwa pada hari ini siswa pulang lebih awal pada pukul *" + jam + " WIB* dikarenakan adanya *" + kegiatan + "*.\n\n" +
                   "Mohon Bapak/Ibu dapat menyesuaikan jadwal penjemputan. Terima kasih atas perhatian dan kerja samanya.\n\n" +
                   "Hormat kami,\n" +
                   "Wali Kelas " + kelas + "\n" +
                   "*" + walikelas + "*";
        }
    }

    function updatePreview() {
        document.getElementById("previewText").innerText = generatePesan();
    }

    function kirimWA() {
        var url = "https://wa.me/?text=" + encodeURIComponent(generatePesan());
        window.open(url, '_blank');
    }

    updatePreview();
</script>

</body>
</html>
